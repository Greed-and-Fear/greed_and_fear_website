name: Build and deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npm run build

    - name: Install SSH key and configure known_hosts
      run: |
        mkdir -p ~/.ssh
        echo "$SSHKEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan $HOST >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
      env:
        HOST: ${{secrets.HOST}}
        SSHKEY: ${{ secrets.SSHKEY }}

    - name: SSH into VPS and run commands
      run: |
        ssh -tt $USERNAME@$HOST 'cd web-projects && git pull && docker build --tag "website" . && docker build --tag "greed-backend-image" ./python && docker compose up -d'
      env:
        SSHKEY: ${{ secrets.SSHKEY }}
        HOST: ${{ secrets.HOST }}
        PORT: ${{ secrets.PORT }}
        USERNAME: ${{ secrets.USERNAME }}
