<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Greed &amp; Fear — Pre-Market Sentiment Indicator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="viz-root">
    <div class="app-bar">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 16L9 10L13 14L21 6" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 6H21V12" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="brand-text-name">Greed &amp; Fear</div>
          <div class="brand-text-tagline">insights. Trade. Thrive.</div>
        </div>
      </div>
      <div class="app-bar-actions">
        <button id="refresh">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>
          Run now
        </button>
        <button id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>

    <div class="content">
      <div class="title-row">
        <div>
          <h1>
            Pre-Market Sentiment Indicator
            <svg class="info-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01" stroke-linecap="round"/></svg>
          </h1>
          <div class="subtitle">
            <b>Direction:</b> NASDAQ <span class="sep">&middot;</span> Dow Jones <span class="sep">&middot;</span> NSE Advances/Declines <span class="sep">&middot;</span> GIFT Nifty
            <span class="sep">|</span>
            <b>Volatility:</b> India VIX
          </div>
        </div>
        <div class="last-run-pill" id="last-run-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>
          <span id="last-run-text">Loading&hellip;</span>
        </div>
      </div>

      <div class="hero" id="hero">
        <div class="hero-ring" id="hero-ring">
          <div class="hero-ring-inner neutral" id="hero-ring-inner"></div>
        </div>
        <div class="hero-body">
          <div class="hero-value neutral" id="hero-value">Loading&hellip;</div>
          <div class="hero-meta" id="hero-meta"></div>
        </div>
      </div>

      <div class="tiles" id="tiles"></div>

      <div class="history-card">
        <div class="history-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>
          History
        </div>
        <table id="history-table">
          <thead>
            <tr>
              <th>Time (IST)</th>
              <th>Direction</th>
              <th>Volatility</th>
              <th>NASDAQ</th>
              <th>Dow</th>
              <th>NSE A/D</th>
              <th>GIFT Nifty</th>
              <th>VIX</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
